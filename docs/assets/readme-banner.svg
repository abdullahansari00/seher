<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Seher — a little space to feel heard</title>
  <desc id="description">A calm off-white banner with a blue sunrise and the Seher name in dark charcoal.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f9fa"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <circle cx="1050" cy="340" r="240" fill="none" stroke="#0d6efd" stroke-opacity="0.07" stroke-width="1.5"/>
    <circle cx="1050" cy="340" r="180" fill="none" stroke="#0d6efd" stroke-opacity="0.1" stroke-width="1.5"/>
    <circle cx="1050" cy="340" r="120" fill="none" stroke="#0d6efd" stroke-opacity="0.13" stroke-width="1.5"/>
    <g transform="translate(92 89)" fill="none" stroke="#0d6efd" stroke-width="3" stroke-linecap="round">
      <path d="M0 40 H80 M16 40 A24 24 0 0 1 64 40"/>
      <path d="M40 0 V7 M8 12 L14 18 M72 12 L66 18 M-2 27 L5 29 M82 27 L75 29"/>
    </g>
    <text x="92" y="213" fill="#212529" font-family="Georgia, 'Times New Roman', serif" font-size="78" letter-spacing="-3">Seher</text>
    <text x="95" y="258" fill="#7a6f63" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic">A little space to feel heard.</text>
    <text x="96" y="310" fill="#495057" font-family="Arial, Helvetica, sans-serif" font-size="13" letter-spacing="3">TALK · REFLECT · TAKE YOUR TIME</text>
  </g>
</svg>
