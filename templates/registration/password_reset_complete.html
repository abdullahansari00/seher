{% extends "base.html" %}

{% block title %}Password Reset Complete | Seher{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

    <div class="card shadow-sm border-0">
        <div class="card-body p-4 text-center">

            <h2>Password updated</h2>

            <p class="text-muted">
                Your Seher password has been successfully changed.
            </p>

            <a
                href="{% url 'accounts:login' %}"
                class="btn btn-primary"
            >
                Login
            </a>

        </div>
    </div>

</div>

</div>

{% endblock %}
